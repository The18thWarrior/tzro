name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: linux
            goarch: amd64
            suffix: linux-amd64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build tzro CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o "tzro-${{ matrix.suffix }}" ./cmd/tzro

      - name: Build tzro-mcp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o "tzro-mcp-${{ matrix.suffix }}" ./cmd/tzro-mcp

      - name: Build tzrod daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o "tzrod-${{ matrix.suffix }}" ./cmd/tzrod

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            tzro-${{ matrix.suffix }}
            tzro-mcp-${{ matrix.suffix }}
            tzrod-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Archive Plugins
        run: zip -r plugins.zip plugins/

      - name: Upload to S3
        env:
          S3_BUCKET: tzro-app
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          
          # Upload binaries and plugins to tagged release and latest
          for file in tzro-* tzro-mcp-* tzrod-* plugins.zip; do
            aws s3 cp "$file" "s3://$S3_BUCKET/releases/$TAG/"
            aws s3 cp "$file" "s3://$S3_BUCKET/releases/latest/"
          done
          
          # Upload install script
          aws s3 cp install.sh "s3://$S3_BUCKET/install.sh"
          
          # Upload release notes
          aws s3 cp docs/release-notes/ "s3://$S3_BUCKET/release-notes/" --recursive
