name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Verify Standard installation savings and retained evidence
        run: python3 scripts/verify_release_benchmark.py docs/benchmarks/release-validation.json

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: linux
            goarch: amd64
            suffix: linux-amd64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build tzro CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o "tzro-${{ matrix.suffix }}" ./cmd/tzro

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            tzro-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="$REQUESTED_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Expected a version tag starting with v and a digit" >&2; exit 1 ;;
          esac
          case "$RELEASE_TAG" in *[!a-zA-Z0-9._-]*) exit 1 ;; esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release checksums
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sha256sum tzro-darwin-arm64 tzro-darwin-amd64 tzro-linux-amd64 > SHA256SUMS
          printf '%s\n' "$RELEASE_TAG" > version.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          S3_BUCKET: tzro-app
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The installer resolves latest/version.txt, then uses the pinned release.
          for file in tzro-*; do
            aws s3 cp "$file" "s3://$S3_BUCKET/releases/$RELEASE_TAG/"
            aws s3 cp "$file" "s3://$S3_BUCKET/releases/latest/"
          done
          aws s3 cp SHA256SUMS "s3://$S3_BUCKET/releases/$RELEASE_TAG/SHA256SUMS"
          aws s3 cp SHA256SUMS "s3://$S3_BUCKET/releases/latest/SHA256SUMS"
          aws s3 cp version.txt "s3://$S3_BUCKET/releases/$RELEASE_TAG/version.txt"
          aws s3 cp version.txt "s3://$S3_BUCKET/releases/latest/version.txt" --cache-control no-cache
          
          # Upload install script
          aws s3 cp install.sh "s3://$S3_BUCKET/install.sh"
          
          # Upload release notes
          aws s3 cp docs/release-notes/ "s3://$S3_BUCKET/release-notes/" --recursive
